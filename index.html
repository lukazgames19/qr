<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect - Lucas</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #ff0055; 
            --bg-color: #0a0a0a;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            font-family: 'Share Tech Mono', monospace;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            
            background: linear-gradient(45deg, #0f0c29, #302b63, #24243e, #ff0055);
            background-size: 400% 400%;
            animation: technoGradient 15s ease infinite;
        }

        @keyframes technoGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .profile-card {
            text-align: center;
            max-width: 350px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 20px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 2rem;
            margin: 0;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--primary-color);
            text-shadow: 0 0 10px var(--primary-color);
        }

        p {
            font-size: 0.9rem;
            color: #ccc;
            margin: 15px 0 30px 0;
            line-height: 1.4;
        }

        .link-button {
            display: block;
            background: transparent;
            border: 1px solid var(--primary-color);
            color: white;
            padding: 18px;
            margin-bottom: 15px;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            width: 100%;
            box-sizing: border-box;
        }

        .link-button:hover {
            background: var(--primary-color);
            box-shadow: 0 0 25px var(--primary-color);
            transform: scale(1.02);
        }

        .copy-btn {
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #aaa;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            margin-top: 10px;
        }

        .copy-btn:active {
            transform: scale(0.95);
        }

        /* --- STYLE DE LA FENÊTRE QR CODE (MODALE) --- */
        .modal {
            display: none; /* Caché par défaut */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #111;
            padding: 30px;
            border-radius: 20px;
            border: 2px solid var(--primary-color);
            text-align: center;
            max-width: 280px;
            box-shadow: 0 0 40px var(--primary-color);
        }

        .modal-content img {
            width: 200px;
            height: 200px;
            border-radius: 10px;
            margin: 15px 0;
            border: 2px solid white;
        }

        .close-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-family: inherit;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <h1>LUCAS</h1>
        <p>Ravi de t'avoir croisé ! ⚡️<br>Ajoute-moi pour qu'on puisse discuter.</p>

        <a href="https://instagram.com/c_lucas____" target="_blank" class="link-button">Instagram</a>
        
        <!-- Bouton pour ouvrir le QR Code -->
        <button class="link-button" onclick="openModal()">Afficher mon QR Code</button>
        
        <button class="copy-btn" id="copyBtn" onclick="copyPseudo()">
            Copier le pseudo
        </button>
    </div>

    <!-- Fenêtre Pop-up du QR Code -->
    <div class="modal" id="qrModal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <p style="color: white; margin: 0; font-weight: bold;">SCANNE-MOI ⚡️</p>
            <!-- Assure-toi d'avoir une image nommée qrcode.png dans ton dossier -->
            <img src="qrcode.png" alt="Mon QR Code">
            <button class="close-btn" onclick="closeModal()">Fermer</button>
        </div>
    </div>

    <script>
        function copyPseudo() {
            const pseudo = 'c_lucas____';
            navigator.clipboard.writeText(pseudo).then(() => {
                const btn = document.getElementById('copyBtn');
                const originalText = btn.innerText;
                
                btn.innerText = '✅ Pseudo copié !';
                btn.style.color = '#00ff99';
                
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.color = '#aaa';
                }, 2000);
            });
        }

        // Fonctions pour gérer l'affichage du pop-up QR Code
        function openModal() {
            document.getElementById('qrModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('qrModal').style.display = 'none';
        }
    </script>

</body>
</html>
